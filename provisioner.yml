name: hcl_domino_standalone_provisioner
version: 0.5.1
label: HCL Domino Standalone Provisioner
description: Provisions a standalone HCL Domino server that creates a new Domino domain
author: STARTcloud
icon: https://startcloud.com/brand-assets/startcloud.svg
homepage: https://startcloud.com/
id_files:
  safe_id_dir: user-safe-ids
  keep_original_name: false
metadata:
  defaults:
    settings:
      box: STARTcloud/debian12-server
      box_url: https://boxvault.startcloud.com
      box_version: 2025.4.30
      box_arch: amd64
      os_type: Debian_64
      firmware_type: UEFI
      setup_wait: 420
      vagrant_user: startcloud
    disks:
      boot:
        type: template
        volume_name: boot
        mount: /
      additional_disks:
        - type: blank
          size: 50G
          sparse: true
          volume_name: disk1
          mount: /local
          filesystem: xfs
          driver: virtio-scsi
    networks:
      - type: external
        dhcp4: true
    tags:
      - domino
      - standalone
    guest_agent: true
  configuration:
    groups:
      - name: provider
        label: Provider
      - name: domino
        label: Domino
      - name: ssl
        label: SSL
      - name: domino_iq
        label: Domino IQ
      - name: installers
        label: Installer Archives
        advanced: true
      - name: packages
        label: Packages
      - name: sync
        label: File Sync
        advanced: true
      - name: proxy
        label: Download Proxy
        advanced: true
      - name: debug
        label: Debugging
        advanced: true
    fields:
      - name: VAGRANT_PROVIDER
        label: Vagrant Provider
        help: Hypervisor the machine is created on, seeded from the host
        type: select
        group: provider
        default: virtualbox
        options_source: hypervisor
      - name: SERVER_ORGANIZATION
        label: Domino Organization
        help: The Domino organization (O=) this standalone server creates
        type: text
        group: domino
        required: true
      - name: DOMINO_ADMIN_PASSWORD
        label: Domino Admin Password
        help: Password for the Domino administrator's Notes ID
        type: text
        group: domino
        default: password
      - name: USER_SAFE_ID
        label: User Safe ID
        help: >-
          Safe ID placed in id-files/user-safe-ids and used for
          cross-certification
        type: secret
        kind: file
        profile: notes_id
        secret_key: user_safe_id
        group: domino
      - name: DOMINO_ADDITIONAL_SERVER_NAMES
        label: Additional Server Names
        help: Fully qualified name of each additional server ID to generate
        type: list
        items: fqdn
        group: domino
      - name: DOMINO_SERVER_ID_CREATION_TOOL
        label: Server ID Creation Tool
        help: Tool that generates the additional server IDs
        type: select
        group: domino
        default: asja
        options:
          - label: One Touch Setup
            value: ots
          - label: ASJA
            value: asja
        show_if:
          DOMINO_ADDITIONAL_SERVER_NAMES:
            min_items: 1
      - name: CERT_SELFSIGNED
        label: Use Self-Signed Certificate
        help: Generate a self-signed certificate for this server's web services
        type: checkbox
        group: ssl
        default: true
      - name: HAPROXY_SSL_REDIRECT
        label: Redirect HTTP to HTTPS
        help: Have HAProxy redirect all plain HTTP requests to HTTPS
        type: checkbox
        group: ssl
        default: true
      - name: LETSENCRYPT_ENABLED
        label: Use Let's Encrypt
        help: >-
          Request a certificate from Let's Encrypt instead of using a
          self-signed one — requires a publicly resolvable hostname
        type: checkbox
        group: ssl
        default: false
      - name: LETSENCRYPT_STAGING_ENABLED
        label: Use Let's Encrypt Staging Environment
        help: >-
          Use the Let's Encrypt staging CA to avoid production rate limits while
          testing
        type: checkbox
        group: ssl
        default: false
        show_if:
          LETSENCRYPT_ENABLED: true
      - name: DOMINO_IQ_ENDPOINT_URL
        label: Domino IQ Endpoint URL
        help: >-
          HTTPS chat completions URL of the OpenAI compatible AI endpoint Domino
          IQ sends requests to in Remote mode; Remote mode RAG needs Domino
          14.5.1 with FP1
        type: text
        group: domino_iq
        default: https://webui.assistant.prominic.net/api/chat/completions
      - name: DOMINO_IQ_MODEL
        label: Domino IQ Model
        help: >-
          Name of the model the AI endpoint serves, sent in every chat
          completions request
        type: text
        group: domino_iq
        default: llama3.1:latest
      - name: DOMINO_IQ_API_KEY
        label: Domino IQ API Key
        help: >-
          API key the remote AI endpoint requires on every chat completions
          request
        type: secret
        kind: api_key
        profile: openai
        secret_key: domino_iq_api_key
        group: domino_iq
        show_if:
          domino_iq_enabled: true
      - name: DOMINO_IQ_USE_MAX_COMPLETION_TOKENS
        label: Use max_completion_tokens
        help: >-
          Sets DOMIQ_USE_MAX_COMPLETION_TOKENS=1 in notes.ini, required by
          GPT-5.1 style remote models
        type: checkbox
        group: domino_iq
        default: false
      - name: INSTALLER_SERVER
        label: Installer Server
        help: >-
          URL, user and password of the installer server the roles download
          archives from
        type: secret
        kind: basic_auth
        profile: installer_server
        secret_key: installer_url
        group: installers
      - name: INSTALLER_BEARER
        label: Installer Server Bearer Token
        help: >-
          Bearer token the roles send the installer server before falling back
          to the user and password
        type: secret
        kind: api_key
        profile: installer_server
        secret_key: installer_url_bearer
        group: installers
      - name: DOMINO_INSTALLER
        label: Domino Server Installer Archive
        help: >-
          Filename of the Domino server installer tar placed in
          installers/domino/archives or downloaded from your installer server
        type: text
        group: installers
        default: Domino_14.5.1_Linux_English.tar
      - name: DOMINO_HASH
        label: Domino Installer SHA256 Hash
        help: Optional SHA256 checksum used to verify the Domino installer archive
        type: text
        group: installers
      - name: DOMINO_INSTALLER_MAJOR_VERSION
        label: Domino Major Version
        help: Major version of the Domino installer, for example 14
        type: number
        group: installers
        default: 14
      - name: DOMINO_INSTALLER_MINOR_VERSION
        label: Domino Minor Version
        help: Minor version of the Domino installer, for example 5
        type: number
        group: installers
        default: 5
      - name: DOMINO_INSTALLER_PATCH_VERSION
        label: Domino Patch Version
        help: Patch version of the Domino installer, for example 1
        type: number
        group: installers
        default: 1
      - name: DOMINO_INSTALLER_FIXPACK_INSTALL
        label: Install a Domino Fixpack
        help: Apply a Domino fixpack after the base install
        type: checkbox
        group: installers
        default: false
      - name: DOMINO_INSTALLER_FIXPACK
        label: Domino Fixpack Archive
        help: Filename of the Domino fixpack archive in installers/domino/archives
        type: text
        group: installers
        default: Domino_1451FP1_Linux.tar
        show_if:
          DOMINO_INSTALLER_FIXPACK_INSTALL: true
      - name: DOMINO_INSTALLER_FIXPACK_VERSION
        label: Domino Fixpack Version
        help: Fixpack designation, for example FP1
        type: text
        group: installers
        default: FP1
        show_if:
          DOMINO_INSTALLER_FIXPACK_INSTALL: true
      - name: DOMINO_FP_HASH
        label: Domino Fixpack SHA256 Hash
        help: Optional SHA256 checksum used to verify the fixpack archive
        type: text
        group: installers
        show_if:
          DOMINO_INSTALLER_FIXPACK_INSTALL: true
      - name: DOMINO_INSTALLER_HOTFIX_INSTALL
        label: Install a Domino Hotfix
        help: Apply a Domino hotfix after the base install and any fixpack
        type: checkbox
        group: installers
        default: false
      - name: DOMINO_INSTALLER_HOTFIX
        label: Domino Hotfix Archive
        help: Filename of the Domino hotfix archive in installers/domino/archives
        type: text
        group: installers
        show_if:
          DOMINO_INSTALLER_HOTFIX_INSTALL: true
      - name: DOMINO_INSTALLER_HOTFIX_VERSION
        label: Domino Hotfix Version
        help: Hotfix designation, for example HF123
        type: text
        group: installers
        show_if:
          DOMINO_INSTALLER_HOTFIX_INSTALL: true
      - name: DOMINO_HF_HASH
        label: Domino Hotfix SHA256 Hash
        help: Optional SHA256 checksum used to verify the hotfix archive
        type: text
        group: installers
        show_if:
          DOMINO_INSTALLER_HOTFIX_INSTALL: true
      - name: LEAP_INSTALLER
        label: Leap Installer Archive
        help: >-
          Filename of the HCL Leap installer archive in installers/leap/archives
          — required when the Leap role is enabled
        type: text
        group: installers
        default: hcl.dleap-1.1.10.14.zip
      - name: LEAP_INSTALLER_VERSION
        label: Leap Version
        help: Version of the Leap installer, for example 1.1.10
        type: text
        group: installers
        default: 1.1.10
      - name: LEAP_HASH
        label: Leap Installer SHA256 Hash
        help: Optional SHA256 checksum used to verify the Leap archive
        type: text
        group: installers
      - name: NOMADWEB_INSTALLER
        label: Nomad Web Installer Archive
        help: >-
          Filename of the HCL Nomad Web archive in installers/nomadweb/archives
          — required when the Nomad Web role is enabled
        type: text
        group: installers
        default: HCL_Nomad_server_1.0.21_linux.tar.gz
      - name: NOMADWEB_VERSION
        label: Nomad Web Version
        help: Version of the Nomad Web archive, for example 1.0.21
        type: text
        group: installers
        default: 1.0.21
      - name: NOMADWEB_HASH
        label: Nomad Web Installer SHA256 Hash
        help: Optional SHA256 checksum used to verify the Nomad Web archive
        type: text
        group: installers
      - name: NOMADWEB_HOTFIX_INSTALL
        label: Install a Nomad Web Hotfix
        help: Apply a Nomad Web interim fix after the Nomad Web install
        type: checkbox
        group: installers
        default: false
      - name: NOMADWEB_HOTFIX
        label: Nomad Web Hotfix Archive
        help: >-
          Filename of the HCL Nomad Web interim fix archive in
          installers/nomadweb/archives
        type: text
        group: installers
        default: HCL_Nomad_server_1.0.21-IF1_linux.tgz
        show_if:
          NOMADWEB_HOTFIX_INSTALL: true
      - name: NOMADWEB_HOTFIX_VERSION
        label: Nomad Web Hotfix Version
        help: Interim fix designation, for example IF1
        type: text
        group: installers
        default: IF1
        show_if:
          NOMADWEB_HOTFIX_INSTALL: true
      - name: TRAVELER_INSTALLER
        label: Traveler Installer Archive
        help: >-
          Filename of the HCL Traveler archive in installers/traveler/archives —
          required when the Traveler role is enabled
        type: text
        group: installers
        default: Traveler_14.5.1_Linux_ML.tar
      - name: TRAVELER_INSTALLER_VERSION
        label: Traveler Version
        help: Version of the Traveler installer, for example 14.5.1
        type: text
        group: installers
        default: 14.5.1
      - name: TRAVELER_FP_INSTALL
        label: Install a Traveler Fixpack
        help: Apply a Traveler fixpack after the Traveler install
        type: checkbox
        group: installers
        default: false
      - name: TRAVELER_FP_INSTALLER
        label: Traveler Fixpack Archive
        help: >-
          Filename of the Traveler fixpack archive in
          installers/traveler/archives
        type: text
        group: installers
        default: Traveler_14.5.1FP1_Linux_ML.tar.gz
        show_if:
          TRAVELER_FP_INSTALL: true
      - name: TRAVELER_FP_INSTALLER_VERSION
        label: Traveler Fixpack Version
        help: Fixpack designation, for example FP1
        type: text
        group: installers
        default: FP1
        show_if:
          TRAVELER_FP_INSTALL: true
      - name: VERSE_INSTALLER
        label: Verse Installer Archive
        help: >-
          Filename of the HCL Verse archive in installers/verse/archives —
          required when the Verse role is enabled
        type: text
        group: installers
        default: HCL_Verse_3.2.6.zip
      - name: VERSE_INSTALLER_VERSION
        label: Verse Version
        help: Version of the Verse installer, for example 3.2.6
        type: text
        group: installers
        default: 3.2.6
      - name: DOMINO_REST_API_INSTALLER
        label: Domino REST API Installer Archive
        help: >-
          Filename of the Domino REST API archive in
          installers/domino-rest-api/archives — required when the REST API role
          is enabled
        type: text
        group: installers
        default: Domino_REST_API_V1.1.7_R14.5_Installer.tar.gz
      - name: DOMINO_REST_API_INSTALLER_VERSION
        label: Domino REST API Version
        help: Version of the Domino REST API installer, for example 1.1.7
        type: text
        group: installers
        default: 1.1.7
      - name: EXTRA_PACKAGES
        label: Extra Packages
        help: Additional Debian packages installed during provisioning
        type: multiselect
        group: packages
        default:
          - htop
        options:
          - htop
          - tmux
          - vim
          - curl
          - wget
          - ncdu
          - iotop
      - name: SYNCBACK_ID_FILES
        label: Sync ID Files Back to Host
        help: >-
          Copy generated Domino ID files from the guest back to the host
          id-files directory after provisioning
        type: checkbox
        group: sync
        default: true
      - name: USE_PROXY
        label: Use HTTP Proxy for Downloads
        help: Route installer downloads and package updates through an HTTP proxy
        type: checkbox
        group: proxy
        default: false
      - name: PROXY_SERVER
        label: Proxy Server
        help: Hostname or IP address of the HTTP proxy
        type: text
        group: proxy
        required: true
        show_if:
          USE_PROXY: true
      - name: PROXY_PORT
        label: Proxy Port
        help: TCP port of the HTTP proxy
        type: number
        group: proxy
        default: 3128
        show_if:
          USE_PROXY: true
        validate:
          min: 1
          max: 65535
      - name: DEBUG_ALL
        label: Verbose Provisioner Debug
        help: Enable verbose output for all Ansible provisioning tasks
        type: checkbox
        group: debug
        default: true
  presentation: {}
  roles:
    - name: setup
      label: Setup
      description: >-
        Sets the timezone and creates the completion and support bundle
        directories
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: networking
      label: Networking
      description: Post-boot network configuration and the host's DNS alias records
      collection: startcloud.startcloud_roles
      tags: always
      default_enabled: true
      required: true
    - name: disks
      label: Disks
      description: Formats and mounts the additional disks
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: hostname
      label: Hostname
      description: Sets the hostname and domain
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: dependencies
      label: Dependencies
      description: Installs the base packages and the extra packages
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: mdns
      label: mDNS
      description: Advertises the host on the local network through Avahi
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: service_user
      label: Service User
      description: Creates the service user and group the applications run as
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: sdkman_install
      label: SDKMAN
      description: Installs the SDKMAN SDK manager for the service user
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
      depends_on:
        - service_user
    - name: sdkman_java
      label: Java (SDKMAN)
      description: Installs a Java JDK via SDKMAN
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
      depends_on:
        - sdkman_install
    - name: sdkman_maven
      label: Maven (SDKMAN)
      description: Installs Apache Maven via SDKMAN
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
      depends_on:
        - sdkman_install
    - name: sdkman_gradle
      label: Gradle (SDKMAN)
      description: Installs the Gradle build tool via SDKMAN
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
      depends_on:
        - sdkman_install
    - name: ssl
      label: SSL
      description: >-
        Generates or imports the server certificates and exports the PFX, PEM
        and JKS bundles
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: domino_reset
      label: Domino Reset
      description: >-
        Resets an existing Domino installation back to a pre-setup state before
        configuring
      collection: startcloud.hcl_roles
      default_enabled: false
    - name: domino_install
      label: Domino Server
      description: Installs the HCL Domino server from the configured installer archive
      collection: startcloud.hcl_roles
      default_enabled: true
      installer_dir: domino
      files:
        installer:
          answers:
            name: DOMINO_INSTALLER
            hash: DOMINO_HASH
            major: DOMINO_INSTALLER_MAJOR_VERSION
            minor: DOMINO_INSTALLER_MINOR_VERSION
            patch: DOMINO_INSTALLER_PATCH_VERSION
        fixpack:
          answers:
            name: DOMINO_INSTALLER_FIXPACK
            hash: DOMINO_FP_HASH
            version: DOMINO_INSTALLER_FIXPACK_VERSION
            install: DOMINO_INSTALLER_FIXPACK_INSTALL
        hotfix:
          answers:
            name: DOMINO_INSTALLER_HOTFIX
            hash: DOMINO_HF_HASH
            version: DOMINO_INSTALLER_HOTFIX_VERSION
            install: DOMINO_INSTALLER_HOTFIX_INSTALL
    - name: domino_vagrant_rest_api
      label: Vagrant REST API
      description: >-
        Installs the REST API used by Super.Human.Installer and the platform to
        manage the guest
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_service_nash
      label: Nash Service Manager
      description: Manages the Domino server as a systemd service via Nash
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_java_config
      label: Domino Java Configuration
      description: Configures Java for Domino agents and applications
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_java_tools
      label: Domino Java Tools
      description: Installs Java-based Domino management tools
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_updatesite
      label: Domino Update Site
      description: Deploys the Eclipse update site database used to install Domino plugins
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_config
      label: Domino Configuration
      description: Runs Domino One Touch Setup to register and configure the server
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_genesis
      label: Genesis
      description: >-
        Installs the Genesis directory used to deploy Domino applications
        automatically
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_genesis_applications
      label: Genesis Applications
      description: >-
        Deploys the configured Genesis packages such as netmonitor and
        SuperHumanPortal
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_genesis
    - name: domino_cross_certify
      label: Cross Certify Safe IDs
      description: >-
        Cross-certifies user safe IDs against the server certifier — standalone
        servers only
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_java_app_example
      label: Java Servlet Example
      description: Deploys an example Domino Java servlet application
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_java_config
    - name: domino_oidc
      label: Domino OIDC Provider
      description: Configures Domino as an OIDC identity provider
      collection: startcloud.hcl_roles
      default_enabled: true
      depends_on:
        - domino_install
    - name: domino_leap
      label: HCL Leap
      description: >-
        Installs HCL Leap low-code application platform from the configured
        archive
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
      installer_dir: leap
      files:
        installer:
          answers:
            name: LEAP_INSTALLER
            hash: LEAP_HASH
            version: LEAP_INSTALLER_VERSION
    - name: domino_traveler
      label: HCL Traveler
      description: Installs HCL Traveler for mobile mail and PIM synchronization
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
      installer_dir: traveler
      files:
        installer:
          answers:
            name: TRAVELER_INSTALLER
            version: TRAVELER_INSTALLER_VERSION
        fixpack:
          answers:
            name: TRAVELER_FP_INSTALLER
            version: TRAVELER_FP_INSTALLER_VERSION
            install: TRAVELER_FP_INSTALL
    - name: domino_traveler_htmo
      label: Traveler HTMO
      description: Installs HCL Traveler for Microsoft Outlook on top of Traveler
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_traveler
    - name: domino_verse
      label: HCL Verse
      description: Installs the HCL Verse web mail client from the configured archive
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
      installer_dir: verse
      files:
        installer:
          answers:
            name: VERSE_INSTALLER
            version: VERSE_INSTALLER_VERSION
    - name: domino_iq
      label: HCL Domino IQ
      description: >-
        Enables HCL Domino IQ and points it at the configured AI endpoint —
        Remote mode RAG needs Domino 14.5.1 with FP1
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_genesis
    - name: domino_rest_api
      label: Domino REST API
      description: Installs the HCL Domino REST API from the configured archive
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
      installer_dir: domino-rest-api
      files:
        installer:
          answers:
            name: DOMINO_REST_API_INSTALLER
            version: DOMINO_REST_API_INSTALLER_VERSION
    - name: domino_nomadweb
      label: HCL Nomad Web
      description: Installs HCL Nomad Web for browser-based Notes client access
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
      installer_dir: nomadweb
      files:
        installer:
          answers:
            name: NOMADWEB_INSTALLER
            hash: NOMADWEB_HASH
            version: NOMADWEB_VERSION
        hotfix:
          answers:
            name: NOMADWEB_HOTFIX
            version: NOMADWEB_HOTFIX_VERSION
            install: NOMADWEB_HOTFIX_INSTALL
    - name: domino_jedi
      label: Jedi
      description: Installs Jedi for Domino process management as an alternative to Nash
      collection: startcloud.hcl_roles
      default_enabled: false
      depends_on:
        - domino_install
    - name: domino_vagrant_readme
      label: Domino README
      description: Writes the Domino access details README on the guest
      collection: startcloud.hcl_roles
      default_enabled: true
      required: true
    - name: support_bundle
      label: Support Bundle
      description: Collects the provisioning logs and variables into the support bundle
      collection: startcloud.startcloud_roles
      default_enabled: true
      required: true
    - name: quick_start
      label: Quick Start Page
      description: Serves the provisioning status and welcome page during and after setup
      collection: startcloud.startcloud_roles
      tags: always
      default_enabled: true
    - name: haproxy
      label: HAProxy
      description: >-
        Installs HAProxy as the TLS-terminating reverse proxy in front of Domino
        web services
      collection: startcloud.startcloud_roles
      default_enabled: true
      depends_on:
        - ssl
    - name: vagrant_readme
      label: Vagrant README
      description: >-
        Generates a README on the guest describing access details for this
        machine
      collection: startcloud.startcloud_roles
      default_enabled: false
    - name: lockdown
      label: Lockdown
      description: >-
